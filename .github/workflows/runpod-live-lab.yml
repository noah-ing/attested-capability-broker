name: Runpod lab contract check (no Runpod resources)

'on':
  workflow_dispatch:
    inputs:
      worker_image:
        description: Immutable linux/amd64 worker reference (registry/repository@sha256:...)
        required: true
        type: string
      max_duration_minutes:
        description: Bound validated for the local-only live runner
        required: true
        default: "10"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
          - "20"
          - "30"
permissions:
  contents: read

jobs:
  validate-only:
    name: Validate inputs and fake worker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WORKER_IMAGE: ${{ inputs.worker_image }}
      MAX_DURATION_MINUTES: ${{ inputs.max_duration_minutes }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install the locked local test environment
        run: uv sync --frozen --extra dev

      - name: Run contract validation without Runpod infrastructure
        shell: bash
        run: |
          ./examples/runpod-untrusted-caller/scripts/run-live.sh \
            --validate-only \
            --worker-image "$WORKER_IMAGE" \
            --max-duration-minutes "$MAX_DURATION_MINUTES"
